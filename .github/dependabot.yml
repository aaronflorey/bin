version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
