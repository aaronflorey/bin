[tools]
"aqua:anordal/shellharden" = "latest"
betterleaks = "latest"
go = "1.24"
golangci-lint = "latest"
hk = "latest"
"npm:ls-lint" = "latest"
pinact = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
zizmor = "latest"

[tasks.build]
description = "Build the bin CLI"
run = "go build -o bin/bin ."

[tasks.fmt]
description = "Format staged files"
run = "hk fix --no-fast-fail"

[tasks.fmt-all]
description = "Format all files"
run = "hk fix --all --no-fail-fast"

[tasks.lint]
description = "Lint staged files"
run = "hk check --no-fail-fast"

[tasks.lint-all]
description = "Lint all files"
run = "hk check --all --no-fail-fast"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.test-race]
description = "Run Go tests with race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Run tests with coverage profile"
run = "go test -coverprofile=coverage.out ./..."
